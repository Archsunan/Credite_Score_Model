<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Score Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Credit Score Predictor</h1>
            <p class="subtitle">AI-powered creditworthiness assessment</p>
        </header>

        <div class="main-content">
            <div class="form-section">
                <h2>Applicant Information</h2>
                <form id="creditForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" min="18" max="100" value="35" required>
                        </div>

                        <div class="form-group">
                            <label for="income">Annual Income ($)</label>
                            <input type="number" id="income" name="income" min="0" value="65000" required>
                        </div>

                        <div class="form-group">
                            <label for="employment_length">Employment Length (years)</label>
                            <input type="number" id="employment_length" name="employment_length" min="0" step="0.1" value="5" required>
                        </div>

                        <div class="form-group">
                            <label for="loan_amount">Loan Amount ($)</label>
                            <input type="number" id="loan_amount" name="loan_amount" min="0" value="25000" required>
                        </div>

                        <div class="form-group">
                            <label for="loan_term">Loan Term (months)</label>
                            <select id="loan_term" name="loan_term" required>
                                <option value="12">12 months</option>
                                <option value="24">24 months</option>
                                <option value="36" selected>36 months</option>
                                <option value="48">48 months</option>
                                <option value="60">60 months</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="credit_history_length">Credit History Length (years)</label>
                            <input type="number" id="credit_history_length" name="credit_history_length" min="0" step="0.1" value="10" required>
                        </div>

                        <div class="form-group">
                            <label for="num_credit_lines">Number of Credit Lines</label>
                            <input type="number" id="num_credit_lines" name="num_credit_lines" min="0" value="4" required>
                        </div>

                        <div class="form-group">
                            <label for="debt_to_income">Debt-to-Income Ratio</label>
                            <input type="number" id="debt_to_income" name="debt_to_income" min="0" max="1" step="0.01" value="0.35" required>
                            <small>0 to 1 (e.g., 0.35 = 35%)</small>
                        </div>

                        <div class="form-group">
                            <label for="num_delinquencies">Number of Delinquencies</label>
                            <input type="number" id="num_delinquencies" name="num_delinquencies" min="0" value="0" required>
                        </div>

                        <div class="form-group">
                            <label for="num_inquiries">Number of Credit Inquiries</label>
                            <input type="number" id="num_inquiries" name="num_inquiries" min="0" value="1" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Calculate Credit Score</button>
                </form>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>Assessment Result</h2>
                <div class="result-card">
                    <div class="credit-score-badge" id="scoreBadge">
                        <div class="score-label">Credit Score</div>
                        <div class="score-value" id="scoreValue">-</div>
                    </div>

                    <div class="result-details">
                        <div class="detail-item">
                            <span class="detail-label">Risk Level:</span>
                            <span class="detail-value" id="riskLevel">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Confidence:</span>
                            <span class="detail-value" id="confidence">-</span>
                        </div>
                    </div>

                    <div class="probability-bars" id="probabilityBars"></div>
                </div>
            </div>
        </div>

        <footer>
            <p>⚠️ This is a demonstration tool. Actual credit decisions require comprehensive financial analysis.</p>
        </footer>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
